  #         - 6379:6379
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #         cache-dependency-path: backend/package-lock.json
  #     - run: npm ci
  #     - run: npx prisma generate
  #     - run: npm test
  #       env:
  #         DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopnex_test?schema=public
  #         REDIS_URL: redis://localhost:6379

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Render handles deployments via GitHub integration
      # Uncomment below to trigger a manual deploy via Render API
      # - name: Deploy to Render
      #   run: |
      #     curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Deployment note
        run: echo "Production deployment is handled by Render GitHub integration on push to main"

      - name: Health check
        run: |
          echo "Waiting for deployment..."
          sleep 30
          # Uncomment when deployed:
          # curl -f ${{ vars.BACKEND_URL }}/api/health || exit 1
          echo "Health check placeholder - configure BACKEND_URL when deployed"
